<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#001a2a"/>
      <stop offset="100%" stop-color="#000d15"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#61dafb" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000d15" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="200" height="200" rx="30" ry="30" fill="url(#bgGrad)"/>
  <circle cx="100" cy="90" r="62" fill="url(#glowGrad)" />
  <g filter="url(#softGlow)">
    <circle cx="100" cy="90" r="52" fill="rgba(10,20,30,0.18)" stroke="rgba(97,218,251,0.07)" stroke-width="2"/>
  </g>
  <g transform="translate(100,90)" stroke="#61dafb" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <ellipse rx="36" ry="12" transform="rotate(0)"/>
    <ellipse rx="36" ry="12" transform="rotate(60)"/>
    <ellipse rx="36" ry="12" transform="rotate(120)"/>
  </g>
  <circle cx="100" cy="90" r="6" fill="#61dafb" stroke="#9ff6ff" stroke-width="1"/>
  <text x="100" y="182" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#9ff6ff" text-anchor="middle" letter-spacing="0.5">React</text>
</svg>